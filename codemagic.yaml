workflows:
  android-workflow:
    name: Rally Android Release Build
    max_build_duration: 30
    instance_type: linux_x2 # Fast, free Linux instance for Android builds
    environment:
      flutter: stable
      vars:
        API_BASE_URL: "https://retailers-nuke-unsigned-jaguar.trycloudflare.com/api/v1"
        MAPBOX_ACCESS_TOKEN: "pk.eyJ1IjoiZXNhbXAwMDEiLCJhIjoiY210a24ycTE3MDI0azJ6b2IxMzk0ZmZzbyJ9.gN06AcEqY0iiW2LIrxQ6-Q"
    scripts:
      - name: Set up .env for Flutter Mobile
        script: |
          cd mobile
          echo "API_BASE_URL=$API_BASE_URL" > .env
          echo "MAPBOX_ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN" >> .env
      - name: Set up Android Release Keystore
        script: |
          cd mobile/android
          echo "storePassword=${KEY_STORE_PASSWORD:-rallysports2026}" > key.properties
          echo "keyPassword=${KEY_PASSWORD:-rallysports2026}" >> key.properties
          echo "keyAlias=${KEY_ALIAS:-upload}" >> key.properties
          echo "storeFile=upload-keystore.jks" >> key.properties
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
      - name: Get Flutter dependencies
        script: |
          cd mobile
          flutter pub get
      - name: Flutter Static Analysis
        script: |
          cd mobile
          flutter analyze
      - name: Run Responsive & Unit Tests
        script: |
          cd mobile
          flutter test
      - name: Build Android APK
        script: |
          cd mobile
          flutter build apk --release
      - name: Verify APK Signature Fingerprints
        script: |
          keytool -printcert -jarfile mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Build Android App Bundle (AAB for Play Store)
        script: |
          cd mobile
          flutter build appbundle --release
      - name: Verify AAB Signature Fingerprints
        script: |
          keytool -printcert -jarfile mobile/build/app/outputs/bundle/release/app-release.aab
    artifacts:
      - mobile/build/app/outputs/flutter-apk/*.apk
      - mobile/build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        notify:
          success: true
          failure: true
